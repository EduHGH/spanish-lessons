<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

</style></head><body><main>
<h1>Repaso de gramática · Segunda Parte</h1>
<p class="sub">Clase 14 · La llamada completa — 6 ejercicios de 30 frases. Escribe en los huecos y pulsa «Comprobar».</p>

<script>
const EX=[
{n:"1 · Pretérito perfecto",r:"<b>haber</b> (he, has, ha, hemos, habéis, han) + participio: <i>he llamado, ha perdido, hemos hecho</i>. Irregulares: hecho, visto, escrito, puesto, dicho, abierto, roto, vuelto, resuelto, cubierto.",d:`Esta semana yo ___ (llamar) a tres clientes.|he llamado

Nosotros ___ (rellenar) el formulario.|hemos rellenado

Usted ___ (enviar) el justificante, ¿verdad?|ha enviado
Hoy yo ___ (escribir) dos correos.|he escrito
¿___ (vosotros, ver) el partido esta mañana?|Habéis visto

Nosotros ya ___ (cubrir) el equipaje perdido.|hemos cubierto
¿Qué ___ (tú, decidir) hacer?|has decidido
Este año yo ___ (visitar) Sevilla dos veces.|he visitado`},
{n:"2 · Comparativos",r:"<b>más / menos + adjetivo + que</b>; <b>tan + adjetivo + como</b>; <b>tanto/a/os/as + nombre + como</b>. Irregulares: bueno → <i>mejor</i>, malo → <i>peor</i>. Signos: (+) más, (−) menos, (=) igualdad.",d:`Esta póliza es ___ completa ___ la básica. (+)|más/que
Mi hotel es ___ barato ___ el tuyo. (−)|menos/que
El aeropuerto de Dallas es ___ grande ___ el de Miami. (=)|tan/como
Mi hija es ___ alta ___ yo. (+)|más/que
Esta póliza tiene ___ cobertura ___ la otra. (=)|tanta/como
El plazo de hoy es ___ corto ___ el de ayer. (−)|menos/que
El Mundial tiene ___ aficionados ___ otros torneos. (+)|más/que
Mi hermano tiene ___ maletas ___ yo. (=)|tantas/como
Este vuelo es ___ rápido ___ el otro. (+)|más/que
Esta aseguradora es ___ que la otra. (bueno, +)|mejor
Este hotel es ___ que el anterior. (malo, +)|peor

Hoy hay ___ retrasos ___ ayer. (+)|más/que
Mi seguro cubre ___ cosas ___ el tuyo. (=)|tantas/como
Esta respuesta es ___ útil ___ la anterior. (−)|menos/que
El tren es ___ cómodo ___ el autobús. (+)|más/que
Ella habla ___ rápido ___ yo. (=)|tan/como

El servicio de hoy es ___ que el de ayer. (malo, +)|peor
Hoy hay ___ gente en el aeropuerto ___ ayer. (=)|tanta/como
Este caso es ___ urgente ___ el otro. (+)|más/que
Tengo ___ preguntas ___ tú. (−)|menos/que
Mi equipaje llegó ___ pronto ___ el tuyo. (=)|tan/como`},
{n:"3 · Pretérito indefinido",r:"Acciones terminadas en el pasado (<i>ayer, anoche, el mes pasado</i>). Regulares: -é, -aste, -ó, -amos, -aron / -í, -iste, -ió, -imos, -ieron. Irregulares: ir/ser (fui, fue…), hacer (hice, hizo), tener (tuve), estar (estuve), decir (dije, dijo), poder (pude), dar (di, dio), ver (vi, vio), venir (vine), poner (puse), traer (traje), dormir (durmió, durmieron).",d:`Mi hermano ___ (visitar) Sevilla el mes pasado.|visitó
Ayer nosotros ___ (llegar) a Miami.|llegamos

¿Qué ___ (tú, hacer) el sábado?|hiciste

¿___ (vosotros, comer) en el aeropuerto?|Comisteis

¿Cuándo ___ (tú, recibir) la respuesta?|recibiste

Nosotros ___ (hablar) con la policía.|hablamos

Ellos ___ (traer) los documentos ayer.|trajeron
Anoche nosotros ___ (ver) un partido increíble.|vimos
¿Dónde ___ (tú, comprar) la póliza?|compraste`},
{n:"4 · Condicional de cortesía",r:"Infinitivo + -ía, -ías, -ía, -íamos, -íais, -ían para pedir o proponer con educación: <i>podría, querría, me gustaría, tendría, sería, debería</i>. Irregulares: tendr-, vendr-, sabr-, habr-.",d:`¿___ (poder, usted) darme su número de póliza?|Podría
Me ___ (gustar) ayudarle.|gustaría
¿___ (poder, tú) repetir, por favor?|Podrías
Yo ___ (querer) hablar con un agente.|querría
¿___ (tener, usted) un momento?|Tendría
¿___ (ser) posible cambiar el vuelo?|Sería

___ (deber, usted) adjuntar el justificante.|Debería
¿___ (poder, usted) hablar más despacio, por favor?|Podría
A mi hija le ___ (gustar) ver el partido.|gustaría
¿Le ___ (importar) esperar un momento?|importaría
¿___ (poder, nosotros) pagar con tarjeta?|Podríamos

¿___ (poder, tú) ayudarme con el formulario?|Podrías
Nos ___ (gustar) cambiar la reserva.|gustaría
¿___ (saber, usted) dónde está la oficina?|Sabría
___ (ser) mejor enviar todo hoy.|Sería
¿___ (tener, ustedes) otro formulario?|Tendrían
Me ___ (encantar) visitar Sevilla.|encantaría
¿___ (poder, usted) decirme la fecha del vuelo?|Podría
Yo ___ (querer) una copia de la denuncia.|querría
¿Les ___ (gustar) un café mientras esperan?|gustaría
¿___ (poder, vosotros) esperar un minuto?|Podríais
A mis padres les ___ (gustar) viajar a EE. UU.|gustaría
¿___ (haber) una solución?|Habría
¿___ (venir, usted) mañana a la oficina?|Vendría
¿Me ___ (dar, usted) su teléfono, por favor?|daría`},
{n:"5 · Futuro simple",r:"Infinitivo + -é, -ás, -á, -emos, -éis, -án: <i>responderá, viajaré</i>. Irregulares: tener → tendr-, venir → vendr-, poder → podr-, saber → sabr-, hacer → har-, decir → dir-, poner → pondr-, salir → saldr-, querer → querr-, haber → habr-.",d:`La aseguradora ___ (responder) en cinco días.|responderá
Mi hija ___ (viajar) a Estados Unidos.|viajará
Mañana yo ___ (llamar) a la aerolínea.|llamaré
¿Cuándo ___ (tú, tener) la respuesta?|tendrás
Nosotros ___ (ir) al estadio el sábado.|iremos

¿___ (vosotros, venir) al partido?|Vendréis

Yo ___ (poder) enviar el formulario hoy.|podré

¿Qué ___ (tú, decir) a la policía?|dirás

¿___ (usted, querer) otro formulario?|Querrá
Nosotros ___ (tener) una reunión mañana.|tendremos

Ella ___ (escribir) a la aseguradora.|escribirá
Yo ___ (pagar) la factura el lunes.|pagaré
¿Cuándo ___ (llegar) tu equipaje?|llegará

¿___ (tú, venir) a la oficina mañana?|Vendrás

El próximo mes nosotros ___ (viajar) a Madrid.|viajaremos`},
{n:"6 · Imperativo formal",r:"Forma de <b>usted</b> / <b>ustedes</b>: -ar → -e / -en (<i>rellene</i>), -er/-ir → -a / -an (<i>escriba</i>). Irregulares: tener → tenga, venir → venga, decir → diga, hacer → haga, poner → ponga, ir → vaya, salir → salga. Negativo: <i>no olvide</i>. Con pronombre: <i>siéntese</i>.",d:`___ (rellenar) este formulario, por favor.|Rellene
___ (enviar) el justificante hoy.|Envíe
___ (adjuntar) la copia de la denuncia.|Adjunte

___ (guardar) el número de reclamación.|Guarde

No ___ (olvidar) el pasaporte.|olvide

___ (ustedes, enviar) todo antes del plazo.|Envíen
___ (ustedes, rellenar) los dos formularios.|Rellenen

No ___ (preocuparse) usted.|se preocupe
___ (ustedes, llamar) mañana.|Llamen
___ (ir) a la comisaría, por favor.|Vaya
___ (salir) por la puerta B.|Salga

___ (repetir) el número, por favor.|Repita`}
].map(e=>({...e,items:e.d.split("\n").map(l=>{const[t,a]=l.split("|");return{t,a:a.split("/")}})}));
const $=id=>document.getElementById(id);let cur=0;
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
const strip=s=>norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function render(){
 const e=EX[cur];$("rule").innerHTML=e.r;$("sc").textContent="";
 $("tabs").innerHTML=EX.map((x,i)=>`<button class="${i==cur?'on':''}" data-i="${i}">${x.n}</button>`).join("");
 $("list").innerHTML=e.items.map((it,i)=>{let k=0;const h=it.t.replace(/___/g,()=>`<input class="${it.a.length>1?'s':''}" data-i="${i}" data-k="${k++}" autocomplete="off" autocapitalize="off" spellcheck="false">`);
  return `<li id="q${i}"><span class="n">${i+1}.</span><span class="t">${h}</span><span class="fb" hidden></span></li>`}).join("");
}
function check(){
 const e=EX[cur];let ok=0;
 e.items.forEach((it,i)=>{const li=$("q"+i),ins=[...li.querySelectorAll("input")],fb=li.querySelector(".fb");
  let all=true,acc=false;
  ins.forEach((inp,k)=>{inp.classList.remove("ok","ko");const v=inp.value;
   if(norm(v)===norm(it.a[k]))inp.classList.add("ok");
   else{all=false;inp.classList.add("ko");if(v&&strip(v)===strip(it.a[k]))acc=true}});
  if(all)ok++;
  fb.hidden=all;if(!all)fb.textContent=(acc?"Revisa los acentos. ":"")+"Solución: "+it.a.join(" … ");
  fb.style.display="none"});
}
function showFb(){document.querySelectorAll(".fb").forEach(f=>{if(f.textContent)f.style.display="block"})}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){cur=+b.dataset.i;render()}};
$("chk").onclick=()=>{check();const ok=document.querySelectorAll("li:not(:has(input.ko)) input.ok").length;
 const good=[...document.querySelectorAll("li")].filter(li=>!li.querySelector("input.ko")).length;
 $("sc").textContent=good+" / 30 correctas";
 document.querySelectorAll(".fb").forEach(f=>{f.style.display=f.hidden?"none":"block"})};
$("show").onclick=()=>{EX[cur].items.forEach((it,i)=>document.querySelectorAll("#q"+i+" input").forEach((inp,k)=>inp.value=it.a[k]));check();$("sc").textContent="Soluciones mostradas";document.querySelectorAll(".fb").forEach(f=>f.style.display="none")};
$("rst").onclick=render;
render();
</script></body></html>
