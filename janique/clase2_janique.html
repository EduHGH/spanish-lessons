    <style id="verba-skin">
/* VERBA · capa de estilo. Solo CSS: el JS y el marcado no se tocan. */
:root{
  --ink:#191919;--ivory:#F6F5F0;--inner:#ECE9DF;--cover:#F3F1EA;
  --terra:#C96442;--steel:#5D87B8;--rose:#B86B77;--sage:#538A75;--amber-b:#8A5A14;
  --terra-t:#A04024;--steel-t:#2F5F96;--rose-t:#9A4455;--sage-t:#2F6B55;--amber-t:#7A5212;
  --burgundy:#361B21;--forest:#0B4646;--on-dark:#F6F5F0;--on-dark-soft:#D9CFD1;--terra-l:#E58A68;
  --ok-bg:#D8EFE0;--ok:#14532D;--bad-bg:#F8DADA;--bad:#8A1C1C;--focus:#1F4E8C;
  --grad-ok:linear-gradient(135deg,#D8EFE0,#C4E6D0);--grad-bad:linear-gradient(135deg,#F8DADA,#F1C6C6);
  --text-secondary:#4A4843;--text-muted:#5C5A55;
  --border-subtle:#B8B4A9;--border-strong:#6B675F;
  --ele-terracotta-text:#A04024;--ele-blue-text:#2F5F96;--ele-sage-text:#2F6B55;
  --ele-amber:#7A5212;--ele-amber-border:#8A5A14;
  --shadow-editorial:none;
}
:root.dark{--focus:#F6F5F0}

body{background:var(--bg-canvas);line-height:1.65}

/* Cabecera de navegación: marfil con filete de piedra, sin desenfoque */
[class*="sticky"][class*="backdrop-blur-md"]{background:var(--bg-surface);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--border-stone)}

/* Hero oscuro VERBA (burdeos + brillos terracota/bosque). Se reasignan los tokens
   solo dentro del hero, así todo su texto se adapta sin tocar el JS. */
[class*="rounded-[26px]"][class*="bg-[var(--bg-cover)]"]{
  --text-primary:#F6F5F0;--text-secondary:#D9CFD1;--text-muted:#D9CFD1;
  --ele-terracotta:#E58A68;--ele-terracotta-text:#E58A68;--border-subtle:#F6F5F033;
  color:#F6F5F0;border:0;border-radius:28px;background-color:#361B21;
  background-image:radial-gradient(ellipse 60% 55% at 15% 30%,rgba(201,100,66,.3),transparent 75%),radial-gradient(ellipse 55% 60% at 85% 50%,rgba(11,70,70,.45),transparent 80%);
}
[class*="rounded-[26px]"][class*="bg-[var(--bg-cover)]"] h1{font-style:italic;font-weight:400}
[class*="rounded-[26px]"][class*="bg-[var(--bg-cover)]"] h1 em{font-weight:400}

/* Paneles 28px, tarjetas 18px, opciones/botones 12px, píldoras con borde de 1,5px */
[class*="rounded-[24px]"][class*="bg-[var(--bg-surface)]"]{border-radius:28px;border:1px solid var(--border-stone);box-shadow:none}
.rounded-2xl{border-radius:18px}
[class~="rounded-[10px]"]{border-radius:12px}
.rounded-full.border{border-width:1.5px}
.border-dashed{border-width:2px}

/* Eyebrows: mono en mayúsculas con tracking amplio */
.font-mono-editorial.uppercase{letter-spacing:.14em}

/* Hueco de completar: subrayado grueso como el slot de VERBA */
input.border-b-2{border-bottom-width:3px;font-weight:700}

/* Estados correcto / incorrecto con los degradados de VERBA (modo claro) */
:root:not(.dark) .fx-ok{background-color:var(--ok-bg)!important;background-image:var(--grad-ok)!important;border-color:var(--ok)!important;color:var(--ok)!important}
:root:not(.dark) .fx-bad{background-color:var(--bad-bg)!important;background-image:var(--grad-bad)!important;border-color:var(--bad)!important;color:var(--bad)!important}

/* Colores de texto fijos en el JS -> variantes de texto de VERBA (contraste >= 4,5:1) */
:root:not(.dark) [class~="text-[#5D87B8]"]{color:var(--steel-t)}
:root:not(.dark) [class~="text-[#538A75]"]{color:var(--sage-t)}
:root:not(.dark) [class~="text-[#C96442]"]{color:var(--terra-t)}
:root:not(.dark) [class~="text-[#B86B77]"]{color:var(--rose-t)}
:root:not(.dark) [class~="text-[#9E6B1E]"]{color:var(--amber-t)}
:root:not(.dark) [class~="text-[#5C5A55]"]{color:#4A4843}

/* Foco visible VERBA: 3px azul (claro sobre fondo oscuro) con separación */
button:focus-visible,a:focus-visible,summary:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--focus)!important;outline-offset:3px!important}
</style>
    <style id="verba-grad">
/* VERBA · degradados con contraste garantizado (solo CSS; JS intacto).
   Oscuros -> texto blanco · claros -> texto oscuro · siempre con color sólido de reserva. */
:root{
  --grad-hero:linear-gradient(145deg,#261216 0%,#361B21 50%,#0B4646 100%);
  --grad-burgundy:linear-gradient(135deg,#361B21,#702420);
  --grad-forest:linear-gradient(135deg,#0B4646,#073232);
  --grad-terra:linear-gradient(135deg,#A04024,#7A2F18);
  --grad-steel:linear-gradient(135deg,#2F5F96,#1F4A7A);
  --grad-sage:linear-gradient(135deg,#2F6B55,#1F5240);

[class*="p-4 rounded-xl bg-[var(--bg-card-inner)] border border-[var(--border-strong)] text-[15px]"],
[class~="bg-[var(--ele-blue-soft)]"][class~="border-dashed"]:not([class*="flex-col"]),
[class*="bg-[var(--ele-blue-soft)]/60"],
label[class~="bg-[var(--ele-sage-soft)]"],
details>summary,

  --ele-blue-text:#fff;--ele-sage-text:#fff;--ele-amber:#fff;--ele-burgundy:#fff;--ele-sage:#fff;color:#fff;
}
/* hero y portadas */
[class*="rounded-[26px]"][class*="bg-[var(--bg-cover)]"]{background-color:#261216;background-image:var(--grad-hero)}
/* énfasis cultural: la intervención de Marta */
[class*="p-4 rounded-xl bg-[var(--bg-card-inner)] border border-[var(--border-strong)] text-[15px]"]{background-color:#361B21;background-image:var(--grad-burgundy);border-color:#361B21}
/* apoyo y corrector: botón de ayuda y aviso de corrección */
details>summary,[role="status"][class*="pt-1"][class*="text-[var(--ele-burgundy)]"]{background-color:#0B4646;background-image:var(--grad-forest);padding:.5rem .85rem;border-radius:12px}
/* botón destacado y estados activos */
[class~="bg-[var(--ele-terracotta)]"]{background-color:#A04024;background-image:var(--grad-terra);border-color:#A04024}
/* indicativo: formas regulares (fuera de la bota) */
[class~="bg-[var(--ele-blue-soft)]"][class~="border-dashed"]:not([class*="flex-col"]),[class*="bg-[var(--ele-blue-soft)]/60"]{background-color:#2F5F96;background-image:var(--grad-steel)}
/* léxico: verbos marcados */
label[class~="bg-[var(--ele-sage-soft)]"]{background-color:#2F6B55;background-image:var(--grad-sage);border-color:#1F5240}
/* línea de partes: cinco degradados oscuros + superposición que solo oscurece */
[class*="rounded-full"][class*="overflow-hidden"][class*="h-7"]>a{background-color:var(--c)!important;background-image:linear-gradient(180deg,transparent,rgba(0,0,0,.2)),var(--g)!important}
[class*="rounded-full"][class*="overflow-hidden"][class*="h-7"]>a:nth-child(5n+1){--c:#A04024;--g:var(--grad-terra)}
[class*="rounded-full"][class*="overflow-hidden"][class*="h-7"]>a:nth-child(5n+2){--c:#2F5F96;--g:var(--grad-steel)}
[class*="rounded-full"][class*="overflow-hidden"][class*="h-7"]>a:nth-child(5n+3){--c:#2F6B55;--g:var(--grad-sage)}
[class*="rounded-full"][class*="overflow-hidden"][class*="h-7"]>a:nth-child(5n+4){--c:#0B4646;--g:var(--grad-forest)}
[class*="rounded-full"][class*="overflow-hidden"][class*="h-7"]>a:nth-child(5n){--c:#361B21;--g:var(--grad-burgundy)}
/* claros (modo claro): tarjeta suave, aviso cálido, acierto y error */
:root:not(.dark) .rounded-2xl[class*="bg-[var(--bg-card-inner)]"]{background-color:#F6F5F0;background-image:var(--grad-paper)}
:root:not(.dark) [class*="bg-[var(--ele-rose-soft)]"][class~="border-dashed"],
:root:not(.dark) [class*="bg-[var(--ele-amber-soft)]"][class~="border-dashed"]{background-color:#F4E2DC;background-image:var(--grad-warm)}
:root:not(.dark) :is([class~="bg-[var(--ele-sage-soft)]"][class~="text-[var(--ele-sage)]"]:not(label),[class*="min-h-[46px]"][class~="bg-[var(--ele-sage-soft)]"]){background-color:#D8EFE0;background-image:var(--grad-ok);border-color:#14532D;color:#14532D}
:root:not(.dark) [class*="min-h-[46px]"][class~="bg-[var(--ele-burgundy-soft)]"]{background-color:#F8DADA;background-image:var(--grad-bad);border-color:#8A1C1C;color:#8A1C1C}
