<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clase 01 · Hola, soy Michelle — español A1</title>
<script>try{var d=document.documentElement,t=localStorage.getItem("escolar-theme"),l=localStorage.getItem("escolar-lang");if(t)d.dataset.theme=t;d.dataset.lang=l||"en"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* animaciones explicativas (ax) */
/* ===== animaciones explicativas (ax) ===== */
.ax-ctl{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
@keyframes ax-rise{from{opacity:0;transform:translateY(14px)}}
@keyframes ax-left{from{opacity:0;transform:translateX(-28px)}}
@keyframes ax-dropin{from{opacity:0;transform:translateY(-24px)}}
@keyframes ax-zoom{from{opacity:0;transform:scale(.3)}}
@keyframes ax-old{0%,30%{opacity:1;transform:none}45%,58%{opacity:1;text-decoration:line-through}78%,100%{opacity:0;transform:translateY(28px);text-decoration:line-through}}
@keyframes ax-new{0%,62%{opacity:0;transform:translateY(-26px)}88%,100%{opacity:1;transform:none}}
@keyframes ax-sortin{from{opacity:0;transform:translate(var(--dx,0),-80px) scale(.9)}}
.ax-go .fr{animation:ax-rise .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*.22s)}
.ax-go .fr .t.pr{animation:ax-rise .4s both;animation-delay:calc(var(--i,0)*.22s)}
.ax-go .fr .t.par{animation:ax-left .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*.22s + .15s)}
.ax-go .fr .t.nf{animation:ax-dropin .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*.22s + .3s)}
.ax-go .fr .t.det{animation:ax-zoom .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*.22s + .3s)}
.ax-ar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:0 var(--s3);margin:var(--s3) 0;padding:var(--s3) var(--s2);border:1px solid var(--hair);border-radius:var(--r-lg);background:var(--panel);font:500 clamp(1.5rem,6vw,2.5rem) var(--serif)}
.ax-ar .meta{flex-basis:100%;text-align:center}
.ax-sw{display:inline-grid}.ax-sw>*{grid-area:1/1}
.ax-old{opacity:0}
.ax-go .ax-old{animation:ax-old 3.2s both}
.ax-go .ax-new{animation:ax-new 3.2s both}
.ax-sort{margin-top:var(--s4)}
.ax-buckets{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}

.ax-b{display:grid;gap:var(--s2);align-content:start;min-height:200px;padding:var(--s3);border:2px solid var(--solid);border-radius:var(--r-md);background:var(--bg);color:var(--tx)}
.ax-b h4{margin:0;font:700 1.125rem var(--serif)}
.ax-ch{padding:var(--s2) var(--s3);border:1.5px solid var(--solid);border-radius:var(--r-md);background:var(--panel);color:var(--ink);font:500 1rem/1.35 var(--sans)}
.ax-ch small{display:block;font:500 .875rem var(--mono);color:var(--soft)}
.ax-go .ax-ch{animation:ax-sortin .7s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*.3s)}
.ax-vow{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);align-items:center;margin-top:var(--s3)}
.ax-face{width:136px;height:136px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--panel)}
.ax-mouth{display:block;width:62px;height:72px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 35%,var(--panel));transition:width .45s cubic-bezier(.3,1.4,.5,1),height .45s cubic-bezier(.3,1.4,.5,1)}
.ax-vs{display:flex;flex-wrap:wrap;gap:var(--s2)}
.ax-v{flex-direction:column;gap:0;min-width:64px;padding:var(--s1) var(--s3)}
.ax-v b{font:700 1.5rem/1.2 var(--serif)}.ax-v span{font:500 .875rem var(--mono);color:var(--soft)}
.ax-v[aria-pressed=true]{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel))}
.ax-vc{min-height:1.6em;margin:var(--s3) 0 0}.ax-vc b{font:700 1.125rem var(--serif)}
.ax-bld{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--s4);align-items:center;margin-top:var(--s3)}
.ax-tw{position:relative;overflow:hidden;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--panel)}
.ax-fl{box-sizing:border-box;height:36px;display:flex;align-items:center;padding:0 var(--s3);border-top:1px solid var(--hair);font:500 .875rem var(--mono);transition:background-color .3s}
.ax-fl:first-child{border-top:0}
.ax-fl.on{background:color-mix(in srgb,var(--acc) 16%,var(--panel));font-weight:700}
.ax-me{position:absolute;right:14px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent);transform:translateY(calc(var(--r,4)*36px));transition:transform .9s cubic-bezier(.5,0,.2,1)}
.ax-pl{display:block;font:600 .875rem var(--mono);color:var(--acc)}
.ax-tx{min-height:3em;margin:var(--s1) 0 0;font:500 1.125rem/1.4 var(--serif)}
@media(max-width:640px){.ax-vow,.ax-bld{grid-template-columns:1fr}.ax-face{margin:auto}.ax-buckets{gap:var(--s2)}}

/* ═══ Atelier UI · base de las clases de Michelle ═══
   Madera, carbón y azul acero. Neutros cálidos, un solo acento, una familia tipográfica.
   Escala de 4 y 8 px · radio de 12 px (contenedor) y 8 px (anidado) · bordes de 1 px ·
   sombra en tres capas solo para lo que flota · abrir 240 ms, cerrar 140 ms con ease-out. */
:root{--sand:#F6EDDD;--paper:#FFFDF7;--ink:#1F1F1F;--ink2:#5C5750;--edge:#8A847A;--line:#E7DBC5;--steel:#1850C0;--tint:#DBE8FF;--wood:#F59A23;--softblue:#4A9BF7;--ok:#087539;--ok-bg:#D4F7DF;--ok-line:#12B76A;--bad:#B8153A;--bad-bg:#FFDDD2;--bad-line:#F04A22;--dark-on:#1F1F1F;--violet:#7A3AE0;--pink:#CC1F7A;--teal:#087A87;--orange:#F26B1D;--lime:#86C232;--a1:4px;--a2:8px;--a3:16px;--a4:24px;--a5:32px;--a6:48px;--a7:64px;--rad:12px;--rad2:8px;--sh:0 1px 1px rgba(40,30,20,.05),0 8px 16px rgba(40,30,20,.06),0 28px 48px rgba(40,30,20,.07);--open:240ms;--close:140ms;--out:cubic-bezier(.16,1,.3,1);--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sand:#171615;--paper:#201E1C;--ink:#F4F1E9;--ink2:#B8B2A7;--edge:#7C766D;--line:#38342F;--steel:#5AA2FF;--tint:#183259;--softblue:#2F7BE8;--ok:#55EE9C;--ok-bg:#0F3A22;--ok-line:#22D47E;--bad:#FF9C84;--bad-bg:#4A1D14;--bad-line:#FF5A33;--sh:0 1px 1px rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.3),0 28px 48px rgba(0,0,0,.35);--violet:#A98BFF;--pink:#FF6FB8;--teal:#22D3D3;--orange:#FF8A3D;--lime:#B5F23D;color-scheme:dark}}
:root[data-theme="dark"]{--sand:#171615;--paper:#201E1C;--ink:#F4F1E9;--ink2:#B8B2A7;--edge:#7C766D;--line:#38342F;--steel:#5AA2FF;--tint:#183259;--softblue:#2F7BE8;--ok:#55EE9C;--ok-bg:#0F3A22;--ok-line:#22D47E;--bad:#FF9C84;--bad-bg:#4A1D14;--bad-line:#FF5A33;--sh:0 1px 1px rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.3),0 28px 48px rgba(0,0,0,.35);--violet:#A98BFF;--pink:#FF6FB8;--teal:#22D3D3;--orange:#FF8A3D;--lime:#B5F23D;color-scheme:dark}
/* nombres heredados de ESCOLAR → valores Atelier (la escala se ajusta a 4/8/16/24/32/48) */
:root{--canvas:var(--sand);--panel:var(--paper);--inset:var(--sand);--soft:var(--ink2);--rule:var(--edge);--hair:var(--line);--acc:var(--steel);--serif:var(--f);--sans:var(--f);--mono:var(--f);--s1:4px;--s2:8px;--s3:16px;--s4:16px;--s5:24px;--s6:24px;--s7:32px;--s8:48px;--r-xs:99px;--r-sm:8px;--r-md:8px;--r-lg:12px;--r-xl:12px;--r-chat:12px}

/* ── tonos ───────────────────────────────────────────────
   Estado (reservado a la corrección): ok y no. Identidad: el acento (azul acero) y neutros
   del propio sistema. Se distinguen por valor, glifo y etiqueta, nunca solo por color. */
.tone{--solid:var(--steel);--bg:var(--tint);--bd:var(--steel);--tx:var(--steel);--on:var(--paper)}
.tone.ac,.tone.nf,.tone.lib{--solid:var(--steel);--bg:var(--tint);--bd:var(--steel);--tx:var(--steel);--on:var(--paper)}
.tone.sel{--solid:var(--violet);--bg:color-mix(in srgb,var(--violet) 22%,var(--paper));--bd:var(--violet);--tx:var(--ink);--on:var(--paper)}
.tone.con{--solid:var(--orange);--bg:color-mix(in srgb,var(--orange) 22%,var(--paper));--bd:var(--orange);--tx:var(--ink);--on:var(--dark-on)}
.tone.par{--solid:var(--pink);--bg:color-mix(in srgb,var(--pink) 20%,var(--paper));--bd:var(--pink);--tx:var(--ink);--on:var(--paper)}
.tone.det{--solid:var(--teal);--bg:color-mix(in srgb,var(--teal) 22%,var(--paper));--bd:var(--teal);--tx:var(--ink);--on:var(--paper)}
.tone.hue{--solid:var(--lime);--bg:color-mix(in srgb,var(--lime) 28%,var(--paper));--bd:var(--lime);--tx:var(--ink);--on:var(--dark-on)}
.tone.ok{--solid:var(--ok-line);--bg:var(--ok-bg);--bd:var(--ok-line);--tx:var(--ok);--on:var(--paper)}
.tone.no{--solid:var(--bad);--bg:var(--bad-bg);--bd:var(--bad-line);--tx:var(--bad);--on:var(--paper)}
.tone.hn{--solid:var(--wood);--bg:color-mix(in srgb,var(--wood) 28%,var(--paper));--bd:var(--wood);--tx:var(--ink);--on:var(--dark-on)}
.ax-b.tone.ax-ser,.ax-tb.tone{--solid:var(--violet);--bg:color-mix(in srgb,var(--violet) 22%,var(--paper));--bd:var(--violet);--tx:var(--ink)}
.ax-b.tone.ax-estar,.ax-tp.tone{--solid:var(--teal);--bg:color-mix(in srgb,var(--teal) 22%,var(--paper));--bd:var(--teal);--tx:var(--ink)}
.nu{--bg:var(--paper);--bd:var(--line);--tx:var(--ink);--solid:var(--ink);--on:var(--paper)}

/* ── base ── */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
body{margin:0;background:var(--sand);color:var(--ink);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:clip}
main{position:relative;max-width:920px;margin:0 auto;padding:60px var(--a4) 96px}
h1,h2,h3,h4{margin:0;color:var(--ink);font-family:var(--f);letter-spacing:-.025em;text-wrap:balance}
h1{font-size:clamp(36px,6.5vw,56px);line-height:1.05;font-weight:800;letter-spacing:-.04em}
h2{margin-top:var(--a2);font-size:28px;line-height:1.2;font-weight:800}
h3{font-size:18px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
h4{font-size:16px;line-height:1.3;font-weight:600}
p{margin:0 0 var(--a2);max-width:62ch}
.lede,.inst{max-width:62ch;color:var(--ink2);font-size:16px;line-height:1.6}
.eb{display:block;margin:0 0 var(--a3);color:var(--ink2);font:500 14px/1.5 var(--f);letter-spacing:0;text-transform:none}
b,strong{font-weight:600}
code{font:500 .9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
:is(a,button,input,select,textarea,summary,[tabindex="0"]):focus-visible{outline:2px solid var(--steel);outline-offset:2px}
main:focus,.panel:focus{outline:0}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:var(--a3);top:-120px;z-index:40;padding:var(--a2) var(--a3);border-radius:var(--rad2);background:var(--ink);color:var(--paper);font:600 14px var(--f);text-decoration:none}
.skip:focus{top:calc(var(--a2) + env(safe-area-inset-top,0px))}
.meta{color:var(--ink2);font:500 14px/1.5 var(--f)}
.meta.lg{margin:var(--a2) 0}
.ico{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.seg .ico,.st .ico{width:20px;height:20px}

/* ── cabecera: la franja de madera ── */
main>header{position:relative;margin:0 0 var(--a2);padding:var(--a6) 0 var(--a7);background:none;border:0;border-radius:0;box-shadow:none}
main>header::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:calc(50% - 50vw);right:calc(50% - 50vw);background:repeating-linear-gradient(90deg,transparent 0 63px,color-mix(in srgb,var(--wood) 22%,transparent) 63px 64px)}
main>header>*{max-width:62ch}
main>header h1{max-width:18ch;margin-bottom:var(--a3)}
header .row{display:none}
header .btn{margin-top:var(--a3)}
.cta{display:flex;flex-wrap:wrap;gap:var(--a3);align-items:center;margin-top:var(--a4)}

/* ── tarjeta de ejercicio ── */
.panel{position:relative;margin-top:var(--a4);padding:var(--a5);background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);scroll-margin-top:76px}
.panel>h2{margin-top:var(--a3)}
.panel>.inst{margin-top:var(--a2)}
.item+.item{margin-top:var(--a4);padding-top:var(--a3);border-top:1px solid var(--line)}
.item[hidden]{display:none}
.stp-on .item{margin:0!important;padding:0!important;border:0!important}
.item>label.q{display:block}
.item>.btn{margin:var(--a3) 0 var(--a2)}
.panel>div>.btn{margin-top:var(--a3)}
.grid{display:grid;gap:var(--a3) var(--a4);margin-top:var(--a4);grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.grid>.item,.grid>.item+.item{margin:0;padding:0;border:0}
.grid>.item .q{margin-bottom:var(--a2)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.q{margin:0;font:600 18px/1.45 var(--f);letter-spacing:-.01em;color:var(--ink)}

/* ── etiqueta de familia (insignia) ── */
.badge{display:inline-flex;align-items:center;gap:var(--a1);padding:2px 12px 2px 8px;border:1px solid var(--bd,var(--line));border-radius:99px;background:var(--bg,var(--paper));color:var(--tx,var(--ink));font:600 14px/1.5 var(--f);letter-spacing:0;text-transform:none}
.badge .ico{width:16px;height:16px}
.cat .list .badge{text-transform:none;letter-spacing:normal}

/* ── barra superior, menú y ajustes ── */
#bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:var(--a3);padding:calc(env(safe-area-inset-top,0px) + var(--a2)) var(--a3) var(--a2);background:color-mix(in srgb,var(--sand) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bt{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 16px var(--f);letter-spacing:-.02em;text-transform:none}
#sticky-progress{position:absolute;left:0;right:0;bottom:-1px;height:3px;display:flex;gap:2px}
#sticky-progress i{flex:1;height:100%;background:linear-gradient(90deg,var(--s,var(--steel)) calc(var(--p,0)*100%),transparent 0)}
.hb,.st,.th{display:inline-grid;place-content:center;width:44px;height:44px;padding:0;border:1px solid var(--edge);border-radius:var(--rad2);background:var(--paper);color:var(--ink);transition:background-color var(--close),transform var(--close) var(--out)}
.hb{gap:var(--a1)}
.hb:hover,.st:hover{background:var(--tint)}.hb:active,.st:active{transform:scale(.98)}
.hb span{display:block;width:20px;height:2px;border-radius:2px;background:var(--ink);transition:transform var(--close) var(--out),opacity var(--close)}
.hb[aria-expanded=true] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.hb[aria-expanded=true] span:nth-child(2){opacity:0}
.hb[aria-expanded=true] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
#omb{display:none}
.seg{display:grid;grid-auto-flow:column;overflow:hidden;border:1px solid var(--edge);border-radius:var(--rad2);background:var(--paper)}
.seg button{min-width:44px;min-height:44px;padding:var(--a1) var(--a3);border:0;border-radius:0;background:transparent;color:var(--ink);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--tint)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.st{display:inline-grid}
.set{display:none;position:fixed;right:var(--a3);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:31;gap:var(--a2);padding:var(--a3);background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);transform-origin:top right}
.set.open{display:grid;animation:at-pop var(--open) var(--out)}
.set .meta{white-space:nowrap}
#menu{position:fixed;z-index:31;left:var(--a3);top:calc(env(safe-area-inset-top,0px) + 62px);width:min(330px,calc(100vw - 32px));max-height:calc(100dvh - env(safe-area-inset-top,0px) - 80px);overflow:auto;padding:var(--a2);background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);transform-origin:20px -30px}
#menu[hidden]{display:none}
#menu:not([hidden]){animation:at-menu var(--open) var(--out)}
#idx{display:grid;gap:2px}
#idx a{display:flex;gap:var(--a3);align-items:center;min-height:44px;padding:var(--a2);border-radius:var(--rad2);color:var(--ink);font:500 16px var(--f);text-decoration:none}
#idx a:hover{background:var(--tint)}
#idx a[aria-current]{background:var(--tint);color:var(--steel);font-weight:600}
#idx a b{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 var(--a1);border:1px solid var(--edge);border-radius:var(--rad2);background:var(--paper);color:var(--ink);font:600 14px var(--f)}
#idx a[aria-current] b{border-color:var(--steel);color:var(--steel)}

/* ── botones ── */
.btn,.chip,.opt,.go{transition:transform var(--close) var(--out),background-color var(--close),border-color var(--close)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--a2);min-height:44px;padding:0 var(--a4);border:1px solid var(--edge);border-radius:var(--rad2);background:var(--paper);color:var(--ink);font:600 16px/1.2 var(--f);text-decoration:none}
a.btn{text-decoration:none}
.btn:not([aria-disabled=true]):hover{background:var(--tint)}
.btn:not([aria-disabled=true]):active,.chip:not([aria-disabled=true]):active,.opt:not([aria-disabled=true]):active,.go:active{transform:scale(.98)}
.btn.tone,.btn.pri,.btn.pri.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.tone:not([aria-disabled=true]):hover,.btn.pri:not([aria-disabled=true]):hover,.btn.pri.ink:not([aria-disabled=true]):hover{background:var(--ink2);border-color:var(--ink2)}
.btn.pri{min-height:52px;padding:0 var(--a5)}
.btn.tone.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.btn.tone.no{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.btn[aria-disabled=true]{background:var(--sand);border:1px dashed var(--edge);color:var(--ink2);cursor:not-allowed}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.gh{border-color:transparent;background:none;color:var(--steel)}
.go{flex:none;min-width:44px;min-height:44px;padding:0 var(--a3);border:1px solid var(--ink);border-radius:var(--rad2);background:var(--ink);color:var(--paper);font:600 18px var(--f)}
.go:hover{background:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:var(--a2);align-items:center;margin-top:var(--a3)}

/* ── opciones ── */
.opts{display:flex;flex-wrap:wrap;gap:var(--a2);margin-top:var(--a2)}
